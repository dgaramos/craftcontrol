name: Publish Claudio DR issue

on:
  workflow_dispatch:
    inputs:
      title:
        description: Issue title
        required: true
        type: string
      body:
        description: Issue body in Markdown
        required: true
        type: string
      labels:
        description: Comma-separated labels
        required: false
        type: string
      assignees:
        description: Comma-separated assignees
        required: false
        type: string
      milestone_number:
        description: Optional numeric milestone number
        required: false
        type: string
      project_owner:
        description: Project owner
        required: true
        type: string
      project_number:
        description: Project number
        required: true
        type: string
      project_status:
        description: Project Status option
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create a Claudio DR installation token
        id: claudio-token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAUDIO_DR_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDIO_DR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Create and verify issue
        env:
          GH_TOKEN: ${{ steps.claudio-token.outputs.token }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          LABELS: ${{ inputs.labels }}
          ASSIGNEES: ${{ inputs.assignees }}
          MILESTONE_NUMBER: ${{ inputs.milestone_number }}
          PROJECT_OWNER: ${{ inputs.project_owner }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          PROJECT_STATUS: ${{ inputs.project_status }}
          EXPECTED_AUTHOR: claudio-dr[bot]
          PUBLISHER_APP_SLUG: ${{ steps.claudio-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          [[ -n "$TITLE" ]] || { echo "title is required" >&2; exit 1; }
          [[ -n "$BODY" ]] || { echo "body is required" >&2; exit 1; }
          [[ -z "$MILESTONE_NUMBER" || "$MILESTONE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "milestone_number must be a positive integer" >&2; exit 1; }
          [[ -n "$PROJECT_OWNER" && "$PROJECT_NUMBER" =~ ^[1-9][0-9]*$ && -n "$PROJECT_STATUS" ]] || { echo "complete project metadata is required" >&2; exit 1; }
          jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg labels "$LABELS" \
            --arg assignees "$ASSIGNEES" \
            --arg milestone "$MILESTONE_NUMBER" \
            '{title: $title, body: $body}
             + (if $labels == "" then {} else {labels: ($labels | split(",") | map(select(length > 0)))} end)
             + (if $assignees == "" then {} else {assignees: ($assignees | split(",") | map(select(length > 0)))} end)
             + (if $milestone == "" then {} else {milestone: ($milestone | tonumber)} end)' > issue.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" --input issue.json > created-issue.json
          actual_author="$(jq -r '.user.login' created-issue.json)"
          [[ "$actual_author" == "$EXPECTED_AUTHOR" ]] || { echo "unexpected issue author: $actual_author" >&2; exit 1; }
          [[ "$PUBLISHER_APP_SLUG" == "${EXPECTED_AUTHOR%\[bot\]}" ]] || { echo "unexpected issue publisher" >&2; exit 1; }
          issue_number="$(jq -r .number created-issue.json)"
          project_json="$(gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          project_id="$(jq -er .id <<<"$project_json")"
          item_json="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "https://github.com/${GITHUB_REPOSITORY}/issues/${issue_number}" --format json)"
          item_id="$(jq -er .id <<<"$item_json")"
          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          field_id="$(jq -er '.fields[] | select(.name == "Status") | .id' <<<"$fields_json")"
          option_id="$(jq -er --arg status "$PROJECT_STATUS" '.fields[] | select(.name == "Status") | .options[] | select(.name == $status) | .id' <<<"$fields_json")"
          gh project item-edit --id "$item_id" --project-id "$project_id" --field-id "$field_id" --single-select-option-id "$option_id"
          gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json labels,assignees,milestone,projectItems | jq -e --arg title "$(jq -er .title <<<"$project_json")" 'any(.projectItems[]; .title == $title)' >/dev/null
          gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 1000 --format json | jq -e --arg id "$item_id" --arg status "$PROJECT_STATUS" 'any(.items[]; .id == $id and .status == $status)' >/dev/null
          jq -r '"Created and verified Claudio DR issue #\(.number): \(.html_url)"' created-issue.json
