coverage:
  status:
    project:
      backend:
        flags:
          - backend
        target: 85%
        threshold: 2%
      frontend:
        flags:
          - frontend
        target: 75%
        threshold: 2%
    patch:
      backend:
        flags:
          - backend
        target: 75%
        threshold: 5%
      frontend:
        flags:
          - frontend
        target: 65%
        threshold: 5%

flags:
  backend:
    paths:
      - apps/backend/minecraft_manager/
      - tests/
  frontend:
    paths:
      - apps/frontend/static/js/

comment:
  layout: "reach,diff,flags"
  behavior: default
