name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-backend
      - name: Upload backend coverage
        uses: codecov/codecov-action@v5.4.3
        with:
          files: coverage.xml
          flags: backend
      - name: Upload backend test results
        uses: codecov/test-results-action@v1.1.1
        with:
          files: test-results/*.xml
          flags: backend

  contracts-backend:
    name: contracts-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-contracts

  host-agent:
    name: host-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-host-agent
      - name: Upload host-agent coverage
        uses: codecov/codecov-action@v5.4.3
        with:
          files: coverage-host-agent.xml
          flags: host-agent

  contracts-frontend:
    name: contracts-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-contracts-frontend

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - run: bin/check-frontend
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v5.4.3
        with:
          files: apps/client/coverage/lcov.info
          flags: frontend
      - name: Upload frontend test results
        uses: codecov/test-results-action@v1.1.1
        with:
          files: apps/client/junit.xml
          flags: frontend

  dr-agents:
    name: dr-agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-dr-agents
      - name: Upload dr-agents coverage
        uses: codecov/codecov-action@v5.4.3
        with:
          files: coverage-dr-agents.xml
          flags: dr-agents
      - name: Upload dr-agents test results
        uses: codecov/test-results-action@v1.1.1
        with:
          files: test-results/dr-agents.xml
          flags: dr-agents

  telemetry:
    name: telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - run: bin/check-telemetry
      - name: Upload telemetry coverage
        uses: codecov/codecov-action@v5.4.3
        with:
          files: packs/telemetry/coverage/lcov.info
          flags: telemetry
      - name: Upload telemetry test results
        uses: codecov/test-results-action@v1.1.1
        with:
          files: packs/telemetry/junit.xml
          flags: telemetry

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [backend, contracts-backend, contracts-frontend, frontend, host-agent, dr-agents]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-integration
