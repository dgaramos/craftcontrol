name: Deploy homelab

on:
  workflow_run:
    workflows: [Quality gates]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, homelab, craftcontrol]
    concurrency:
      group: craftcontrol-homelab-production
      cancel-in-progress: false
    environment: homelab
    steps:
      - name: Check out the accepted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and synchronize the release source
        env:
          GITEA_REPOSITORY_URL: ${{ vars.GITEA_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          test -n "$GITEA_REPOSITORY_URL"
          git switch --force-create main "${{ github.event.workflow_run.head_sha }}"
          test -z "$(git status --porcelain)"
          git remote rename origin github
          git remote add origin "$GITEA_REPOSITORY_URL"
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote github refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"

      - name: Run guarded production preflight
        run: bin/deploy-craftcontrol-release --check

      - name: Deploy the pinned release pair
        run: bin/deploy-craftcontrol-release
