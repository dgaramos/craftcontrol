name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-backend

  contracts-backend:
    name: contracts-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-contracts

  contracts-frontend:
    name: contracts-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-contracts-frontend

  host-agent:
    name: host-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-host-agent

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bin/check-frontend

  agent-workflows:
    name: agent-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-agent-workflows

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [backend, contracts-backend, contracts-frontend, frontend, host-agent, agent-workflows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r apps/server/requirements.txt
      - run: bin/check-integration

  deploy:
    name: deploy-homelab
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration]
    runs-on: [self-hosted, homelab, craftcontrol]
    concurrency:
      group: craftcontrol-homelab-production
      cancel-in-progress: false
    environment: homelab
    steps:
      - name: Check out the accepted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy the accepted revision locally
        run: /usr/local/bin/craftcontrol-homelab-deploy "${{ github.sha }}"
