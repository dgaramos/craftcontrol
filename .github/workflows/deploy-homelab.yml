name: Deploy homelab

on:
  workflow_run:
    workflows: [Quality gates]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, homelab, craftcontrol]
    concurrency:
      group: craftcontrol-homelab-production
      cancel-in-progress: false
    environment: homelab
    steps:
      - name: Check out the accepted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy the accepted revision locally
        run: /usr/local/bin/craftcontrol-homelab-deploy "${{ github.event.workflow_run.head_sha }}"
