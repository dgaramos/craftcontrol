name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [frontend, backend, contracts, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r apps/backend/requirements.txt
      - run: bin/check-${{ matrix.gate }}
      - name: Upload backend coverage
        if: matrix.gate == 'backend'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: backend
      - name: Upload backend test results
        if: matrix.gate == 'backend'
        uses: codecov/test-results-action@v1
        with:
          files: test-results/*.xml
          flags: backend
      - name: Upload frontend coverage
        if: matrix.gate == 'frontend'
        uses: codecov/codecov-action@v5
        with:
          files: apps/frontend/coverage/lcov.info
          flags: frontend
      - name: Upload frontend test results
        if: matrix.gate == 'frontend'
        uses: codecov/test-results-action@v1
        with:
          files: apps/frontend/junit.xml
          flags: frontend
