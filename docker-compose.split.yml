services:
  craftcontrol-backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        CRAFTCONTROL_BACKEND_VERSION: "${CRAFTCONTROL_BACKEND_VERSION:-0.1.0}"
    image: "craftcontrol-backend:${CRAFTCONTROL_BACKEND_VERSION:-0.1.0}"
    container_name: craftcontrol-backend
    restart: unless-stopped
    environment:
      MINECRAFT_CONTAINER: "${MINECRAFT_CONTAINER:-minecraft-bedrock}"
      MINECRAFT_PROJECT: "${MINECRAFT_PROJECT:-/minecraft-project}"
      MINECRAFT_COMPOSE_PROJECT: "${MINECRAFT_COMPOSE_PROJECT:-minecraft-bedrock}"
      DATABASE_PATH: "${DATABASE_PATH:-/data/manager.db}"
      CONSOLE_WAIT_SECONDS: "${CONSOLE_WAIT_SECONDS:-1}"
      BOOTSTRAP_OPERATOR: "${BOOTSTRAP_OPERATOR:-VonCrush}"
      RECONCILE_SECONDS: "${RECONCILE_SECONDS:-900}"
      BACKUP_ROOT: "${BACKUP_ROOT:-/data/backups/coordinated}"
      AUTH_MODE: "${AUTH_MODE:-local}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      TZ: "${TZ:-America/Sao_Paulo}"
      CRAFTCONTROL_VERSION: "${CRAFTCONTROL_BACKEND_VERSION:-0.1.0}"
      # Host agent: the split topology routes privileged container lifecycle
      # operations (PREPARATION, RESTART, HEALTH_WAIT) through the
      # craftcontrol-host-agent systemd service (docs/host-agent-contract.md).
      # The Docker socket is still required for Bedrock console operations
      # (BedrockClient: send, query_state, set_operator, request_telemetry_snapshot)
      # and for the log and Docker-event streams used by EventRuntime.
      # These operations are not part of the host-agent contract and must
      # reach the Docker daemon directly from inside the backend container.
      HOST_AGENT_URL: http://host-gateway:7890
      HOST_AGENT_TOKEN_FILE: /run/host-agent-token
    extra_hosts:
      - "host-gateway:host-gateway"
    expose:
      - "8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/craftcontrol/host-agent-token:/run/host-agent-token:ro
      - ../minecraft-bedrock:/minecraft-project
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    labels:
      io.craftcontrol.release-pair: "${CRAFTCONTROL_RELEASE_PAIR:-frontend-0.3.6_backend-0.1.0}"

  craftcontrol-frontend:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        CRAFTCONTROL_FRONTEND_VERSION: "${CRAFTCONTROL_FRONTEND_VERSION:-0.3.6}"
    image: "craftcontrol-frontend:${CRAFTCONTROL_FRONTEND_VERSION:-0.3.6}"
    container_name: craftcontrol-frontend
    restart: unless-stopped
    depends_on:
      craftcontrol-backend:
        condition: service_healthy
    ports:
      - "${CRAFTCONTROL_SPLIT_PORT:-8082}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    labels:
      io.craftcontrol.release-pair: "${CRAFTCONTROL_RELEASE_PAIR:-frontend-0.3.6_backend-0.1.0}"
