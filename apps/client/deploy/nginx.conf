map $http_x_forwarded_proto $craftcontrol_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $craftcontrol_backend http://craftcontrol-backend:8082;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"frontend"}\n';
    }

    location = /version.json {
        access_log off;
        add_header Cache-Control "no-store";
        try_files /version.json =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location /static/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /api/events {
        proxy_pass $craftcontrol_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $craftcontrol_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no always;
    }

    location = /metrics {
        access_log off;
        proxy_pass $craftcontrol_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    location /api/ {
        proxy_pass $craftcontrol_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $craftcontrol_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
    }
}
