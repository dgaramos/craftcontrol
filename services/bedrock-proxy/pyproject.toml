[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-proxy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bedrock-proxy = "agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools]
py-modules = ["agent"]
