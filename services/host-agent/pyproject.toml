[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "host-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
host-agent = "agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["proxy*"]

[tool.setuptools]
py-modules = ["agent"]
