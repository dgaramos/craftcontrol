name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/controlplane/requirements.txt
      - run: bin/check-backend

  contracts-backend:
    name: contracts-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/controlplane/requirements.txt
      - run: bin/check-contracts

  contracts-frontend:
    name: contracts-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/controlplane/requirements.txt
      - run: bin/check-contracts-frontend

  bedrock-proxy:
    name: bedrock-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/controlplane/requirements.txt
      - run: bin/check-bedrock-proxy

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bin/check-frontend

  dr-agents:
    name: dr-agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/controlplane/requirements.txt
      - run: bin/check-dr-agents

  check-deploy:
    name: check-deploy
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/server/controlplane/requirements.txt
      - run: bin/check-deploy
      - name: Upload deploy test results
        uses: codecov/test-results-action@v1.1.1
        with:
          files: test-results/deploy.xml
          flags: deploy

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [backend, contracts-backend, contracts-frontend, frontend, bedrock-proxy, dr-agents, check-deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r apps/server/controlplane/requirements.txt
      - run: bin/check-integration

  deploy:
    name: deploy-homelab
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration]
    runs-on: [self-hosted, homelab, craftcontrol]
    concurrency:
      group: craftcontrol-homelab-production
      cancel-in-progress: false
    environment: homelab
    steps:
      - name: Check out the accepted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy the accepted revision locally
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          /usr/local/bin/craftcontrol-homelab-deploy "$revision"

      - name: Detect Bedrock Proxy changes
        id: bedrock-proxy
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          before="$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")).get("before", ""))')"
          if [[ ! "$before" =~ ^[0-9a-f]{40}$ ]] || [[ "$before" =~ ^0+$ ]]; then
            before="$revision^"
          fi
          if git diff --quiet "$before" "$revision" -- deploy/bedrock-proxy services/bedrock-proxy; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Activate the verified Bedrock Proxy revision
        if: steps.bedrock-proxy.outputs.changed == 'true'
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          deploy/bedrock-proxy/bin/craftcontrol-bedrock-proxy-request-update "$revision"
