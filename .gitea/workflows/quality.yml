name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [frontend, backend, contracts, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r apps/backend/requirements.txt
      - run: bin/check-${{ matrix.gate }}
