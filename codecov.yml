coverage:
  status:
    project:
      backend:
        flags:
          - backend
        target: 85%
        threshold: 2%
      frontend:
        flags:
          - frontend
        target: 75%
        threshold: 2%
      host-agent:
        flags:
          - host-agent
        target: 85%
        threshold: 2%
    patch:
      backend:
        flags:
          - backend
        target: 75%
        threshold: 5%
      frontend:
        flags:
          - frontend
        target: 65%
        threshold: 5%
      host-agent:
        flags:
          - host-agent
        target: 75%
        threshold: 5%

flags:
  backend:
    paths:
      - apps/server/minecraft_manager/
  frontend:
    paths:
      - apps/client/static/js/
  host-agent:
    paths:
      - services/host-agent/

component_management:
  individual_components:
    - component_id: backend_auth
      name: "backend: auth"
      paths:
        - apps/server/minecraft_manager/auth/
    - component_id: backend_core
      name: "backend: core"
      paths:
        - apps/server/minecraft_manager/core/
    - component_id: backend_http
      name: "backend: http"
      paths:
        - apps/server/minecraft_manager/http/
    - component_id: backend_operations
      name: "backend: operations"
      paths:
        - apps/server/minecraft_manager/operations/
    - component_id: backend_players
      name: "backend: players"
      paths:
        - apps/server/minecraft_manager/players/
    - component_id: backend_runtime
      name: "backend: runtime"
      paths:
        - apps/server/minecraft_manager/runtime/
    - component_id: backend_server
      name: "backend: server"
      paths:
        - apps/server/minecraft_manager/server/
    - component_id: backend_telemetry
      name: "backend: telemetry"
      paths:
        - apps/server/minecraft_manager/telemetry/
    - component_id: frontend_components
      name: "frontend: components"
      paths:
        - apps/client/static/js/components/
    - component_id: frontend_core
      name: "frontend: core"
      paths:
        - apps/client/static/js/core/
    - component_id: frontend_features
      name: "frontend: features"
      paths:
        - apps/client/static/js/features/
    - component_id: host_agent
      name: "host-agent"
      paths:
        - services/host-agent/

comment:
  layout: "reach,diff,flags,components"
  behavior: default
