services:
  craftcontrol:
    build: .
    image: craftcontrol:0.2.7
    container_name: craftcontrol
    labels:
      org.opencontainers.image.title: "CraftControl"
      org.opencontainers.image.description: "Mobile-first Minecraft Bedrock control center"
      org.opencontainers.image.version: "0.2.7"
    restart: unless-stopped
    environment:
      MINECRAFT_CONTAINER: "${MINECRAFT_CONTAINER:-minecraft-bedrock}"
      MINECRAFT_PROJECT: "${MINECRAFT_PROJECT:-/minecraft-project}"
      DATABASE_PATH: "${DATABASE_PATH:-/data/manager.db}"
      CONSOLE_WAIT_SECONDS: "${CONSOLE_WAIT_SECONDS:-1}"
      BOOTSTRAP_OPERATOR: "${BOOTSTRAP_OPERATOR:-VonCrush}"
      RECONCILE_SECONDS: "${RECONCILE_SECONDS:-900}"
      BACKUP_ROOT: "${BACKUP_ROOT:-/data/backups/coordinated}"
      AUTH_MODE: "${AUTH_MODE:-local}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      TZ: "${TZ:-America/Sao_Paulo}"
      CRAFTCONTROL_VERSION: "${CRAFTCONTROL_VERSION:-0.2.7}"
    ports:
      - "${MANAGER_PORT:-8082}:8082"
    volumes:
      # Necessário no MVP para restart/exec; a API mantém uma allowlist rígida.
      - /var/run/docker.sock:/var/run/docker.sock
      - ../minecraft-bedrock:/minecraft-project
      - ./data:/data
      - ./apps/backend/app.py:/app/app.py:ro
      - ./apps/backend/wsgi.py:/app/wsgi.py:ro
      - ./apps/backend/minecraft_manager:/app/minecraft_manager:ro
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
      - ./packs:/app/packs:ro
    security_opt:
      - no-new-privileges:true
