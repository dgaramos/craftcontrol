coverage:
  status:
    project:
      backend:
        flags:
          - backend
        target: 85%
        threshold: 2%
      frontend:
        flags:
          - frontend
        target: 75%
        threshold: 2%
      bedrock-proxy:
        flags:
          - bedrock-proxy
        target: 85%
        threshold: 2%
      dr-agents:
        flags:
          - dr-agents
        target: 90%
        threshold: 2%
      telemetry:
        flags:
          - telemetry
        target: 80%
        threshold: 2%
    patch:
      backend:
        flags:
          - backend
        target: 75%
        threshold: 5%
      frontend:
        flags:
          - frontend
        target: 65%
        threshold: 5%
      bedrock-proxy:
        flags:
          - bedrock-proxy
        target: 75%
        threshold: 5%
      dr-agents:
        flags:
          - dr-agents
        target: 90%
        threshold: 5%
      telemetry:
        flags:
          - telemetry
        target: 70%
        threshold: 5%

flags:
  deploy:
    paths:
      - deploy/tests/
      - bin/deploy-craftcontrol*
      - bin/check-deploy
  backend:
    paths:
      - apps/server/controlplane/
  frontend:
    paths:
      - apps/client/static/js/
  bedrock-proxy:
    paths:
      - services/bedrock-proxy/
  dr-agents:
    paths:
      - apps/server/tests/test_agent_workflows.py
  telemetry:
    paths:
      - packs/telemetry/behavior_pack/scripts/

component_management:
  individual_components:
    - component_id: backend_auth
      name: "backend: auth"
      paths:
        - apps/server/controlplane/auth/
    - component_id: backend_core
      name: "backend: core"
      paths:
        - apps/server/controlplane/core/
    - component_id: backend_http
      name: "backend: http"
      paths:
        - apps/server/controlplane/http/
    - component_id: backend_operations
      name: "backend: operations"
      paths:
        - apps/server/controlplane/operations/
    - component_id: backend_players
      name: "backend: players"
      paths:
        - apps/server/controlplane/players/
    - component_id: backend_runtime
      name: "backend: runtime"
      paths:
        - apps/server/controlplane/runtime/
    - component_id: backend_server
      name: "backend: server"
      paths:
        - apps/server/controlplane/server/
    - component_id: backend_telemetry
      name: "backend: telemetry"
      paths:
        - apps/server/controlplane/telemetry/
    - component_id: frontend_components
      name: "frontend: components"
      paths:
        - apps/client/static/js/components/
    - component_id: frontend_core
      name: "frontend: core"
      paths:
        - apps/client/static/js/core/
    - component_id: frontend_features
      name: "frontend: features"
      paths:
        - apps/client/static/js/features/
    - component_id: host_agent
      name: "bedrock-proxy"
      paths:
        - services/bedrock-proxy/

comment:
  layout: "reach,diff,flags,components"
  behavior: default
